[tool.ruff]
line-length = 120
target-version = "py310"
# app/prisma_client is generated by `prisma generate` — never hand-edited,
# never worth linting/type-checking.
extend-exclude = ["app/prisma_client"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names, etc.)
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # flake8-bugbear (common real-bug patterns)
    "UP",  # pyupgrade (modern Python idioms)
]
# E501 (line-too-long) is intentionally off for now: the existing codebase
# doesn't wrap at 120 consistently and a repo-wide reformat isn't part of
# this pass. Worth turning on once someone's ready to do that cleanup.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Generated Prisma client code — not worth applying our style rules to
# code we don't hand-edit and don't own.
"app/prisma_client/**" = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
exclude = ["app/prisma_client/"]
ignore_missing_imports = true  # most deps here (spacy, sentence-transformers, etc.) ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
# The codebase has ~no type annotations today. Requiring them everywhere
# on day one of adding mypy would just mean disabling mypy again a week
# later. check_untyped_defs still gets useful signal (wrong attribute
# names, bad calls) out of unannotated functions without demanding
# annotations up front — tighten this (disallow_untyped_defs = true,
# module by module) as functions get annotated over time.
disallow_untyped_defs = false
check_untyped_defs = true

# `exclude` above only stops mypy from treating app/prisma_client/*.py as
# top-level files to check directly — it still follows imports INTO that
# package from our own code (correctly; we want accurate types from it)
# and, without this, reports the ~250 pre-existing errors INSIDE that
# generated code as if they were ours. ignore_errors here keeps using its
# types for everyone else while not holding us responsible for fixing
# code none of us wrote or hand-maintain.
[[tool.mypy.overrides]]
module = "app.prisma_client.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    # Loads real ML models (spacy, sentence-transformers, the NLI
    # cross-encoder) — correct, not mocked, but a few seconds slower per
    # session than the pure-logic tests. Run everything with `pytest`;
    # run just the fast ones with `pytest -m "not model"`.
    "model: exercises a real (not mocked) ML model",
]

